[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "assignmentwriter"
version = "0.1.0"
description = "A Python package and CLI that writes your text on paper in a handwriting font and ink of your choice"
readme = "PYPI-README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheHritu" }]
keywords = ["assignment", "handwriting", "handwritten", "text-to-handwriting", "image", "pillow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.0",
]
[project.optional-dependencies]
cli = ["rich"]
[project.urls]
Homepage = "https://github.com/TheHritu/AssignmentWriter"
[project.scripts]
assignmentwriter = "assignmentwriter.__main__:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["assignmentwriter*"]
[tool.setuptools.package-data]
assignmentwriter = ["res/papers/*", "res/fonts/*"]
